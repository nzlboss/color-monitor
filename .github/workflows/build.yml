name: Build EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyautogui pillow keyboard pytesseract pyinstaller
          
      - name: Build EXE
        run: |
          pyinstaller --onefile --console --uac-admin --icon boxbot.ico --name "嘉年华箱子助手_BoxBot" color_monitor.py
          
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 嘉年华箱子助手_BoxBot
          path: dist/嘉年华箱子助手_BoxBot.exe
